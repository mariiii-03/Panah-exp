<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PANAH — System Preferences</title>
<link rel="stylesheet" href="styles.css">
<style>
  .commit-btn{position:absolute; top:40px; right:32px;}
  .panel{margin:0 32px 40px; background:var(--cream-dim); border:1px solid var(--sage-deep); border-radius:6px; padding:36px;}
  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:30px;}
  .panel-head h2{margin:0 0 6px; font-family:var(--font-display); font-size:1.5rem; color:var(--navy);}
  .panel-head p{margin:0; color:var(--ink-soft); font-size:.88rem;}
  .pic{width:88px; height:88px; border-radius:6px; background:#d9d3cc; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.8rem; color:var(--ink-soft);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:24px 28px;}
  .field label{display:block; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  .field .box{
    display:flex; align-items:center; justify-content:space-between;
    background:#eef0e6; border-radius:2px; padding:12px 14px; font-family:var(--font-mono); font-size:.9rem; color:var(--navy);
  }
  .field .box svg{width:16px;height:16px; color:var(--ink-soft);}
</style>
</head>
<body>
  <header class="topnav">
    <div class="brand">PANAH</div>
    <nav>
      <a href="home.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>HOME</a>
      <a href="build.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21v-6l9-9 6 6-9 9H4Z"/><path d="M14 7l3-3 3 3-3 3"/></svg>BUILD</a>
      <a href="cost-estimation.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v16"/></svg>COST ESTIMATION</a>
      <a href="history.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>HISTORY</a>
      <a href="guideline.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>STANDARDS</a>
    </nav>
    <div class="right">
      <div class="iconbtn" title="Settings" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
      </div>
      <div class="iconbtn solid" id="profileToggle" title="Account" onclick="location.href='profile-dropdown.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
  </header>
  <div class="page-head" style="position:relative;">
    <h1>System Preferences</h1>
    <p>Settings and setups</p>
    <button class="btn btn-dark commit-btn">&#128190; Commit Changes</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>Operative Details</h2>
        <p>Manage your central identification parameters.</p>
      </div>
      <div class="pic">Pic</div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Designation / Name</label>
        <div class="box">Dr. Aris Thorne <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg></div>
      </div>
      <div class="field">

      </div>
      <div class="field">
        <label>Contact Info</label>
        <div class="box">-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 3a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .6a2 2 0 0 1 1.7 2Z"/></svg></div>
      </div>
      <div class="field">
        <label>Email ID</label>
        <div class="box">a.thorne@system-core.net <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
      </div>
    </div>
  </div>
</body>
</html>
