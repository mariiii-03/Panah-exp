<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PANAH — Account</title>
<link rel="stylesheet" href="styles.css">
<style>
  .hero{min-height:560px; display:flex; align-items:center; justify-content:center; text-align:center; padding:70px 20px; position:relative;}
  .hero-inner .mark{font-family:var(--font-display); font-weight:700; letter-spacing:.08em; font-size:3.4rem; color:#fff; margin:0 0 14px;}
  .hero-inner p{color:#f1f3ec; margin:0 0 26px;}
  .hero-actions{display:flex; gap:14px; justify-content:center;}
  .hero-actions .btn{padding:14px 22px; font-size:.82rem;}

  .dropdown{
    position:absolute; top:56px; right:32px; width:280px;
    background:var(--cream); border-radius:4px; box-shadow:0 18px 40px rgba(0,0,0,.28);
    padding:18px; z-index:60; text-align:left;
    border:1px solid rgba(0,0,0,.06);
  }
  .dropdown .who{display:flex; align-items:center; gap:12px; padding-bottom:14px; margin-bottom:10px; border-bottom:1px solid var(--line);}
  .dropdown .who .avatar{width:40px;height:40px;border-radius:50%;background:var(--navy); color:var(--cream); display:flex;align-items:center;justify-content:center;}
  .dropdown .who .name{font-family:var(--font-display); font-weight:600; color:var(--navy); font-size:.95rem;}
  .dropdown .who .mail{font-family:var(--font-mono); font-size:.72rem; color:var(--green-ok);}
  .dropdown a{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:.78rem; letter-spacing:.03em;
    color:var(--ink); text-decoration:none; padding:10px 4px;
  }
  .dropdown a svg{width:15px;height:15px;}
  .dropdown a.signout{color:var(--red); border-top:1px solid var(--line); margin-top:6px; padding-top:12px;}
</style>
</head>
<body>
  <header class="topnav">
    <div class="brand">PANAH</div>
    <nav>
      <a href="home.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>HOME</a>
      <a href="build.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21v-6l9-9 6 6-9 9H4Z"/><path d="M14 7l3-3 3 3-3 3"/></svg>BUILD</a>
      <a href="cost-estimation.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v16"/></svg>COST ESTIMATION</a>
      <a href="history.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>HISTORY</a>
      <a href="guideline.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>STANDARDS</a>
    </nav>
    <div class="right">
      <div class="iconbtn" title="Settings" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
      </div>
      <div class="iconbtn solid" id="profileToggle" title="Account" onclick="location.href='profile-dropdown.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <h1 class="mark">PANAH</h1>
      <p>AI-Generated, Locally-Adapted, Structurally-Validated Shelter Designs</p>
      <div class="hero-actions">
        <a class="btn btn-lime" href="build.html">+ Start New Build</a>
        <a class="btn btn-ghost" href="history.html">&#128193; View Saved Projects</a>
      </div>
    </div>

    <div class="dropdown">
      <div class="who">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <div>
          <div class="name">User Name</div>
          <div class="mail">user@panah.engine</div>
        </div>
      </div>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2"/></svg>Account Settings</a>
      <a href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16v13H4z"/><path d="M4 6l4-3h8l4 3"/></svg>Saved Projects</a>
      <a href="#" class="signout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Sign Out</a>
    </div>
  </section>
</body>
</html>
